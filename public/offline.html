<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#FF3B30" />
  <title>Offline — Hustle Alliance</title>
  <link rel="icon" href="/icons/icon-192.png" />
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      text-align: center;
      padding: 24px;
    }
    .card { max-width: 420px; }
    .logo {
      width: 84px;
      height: 84px;
      border-radius: 20px;
      background: linear-gradient(135deg, #1C1C1E, #000);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 8px 32px rgba(255, 59, 48, 0.25);
    }
    .logo svg { width: 44px; height: 44px; }
    h1 { font-size: 1.5rem; margin: 20px 0 8px; }
    p { color: #8A8A8A; line-height: 1.6; margin: 0 0 24px; }
    button {
      background: #FF3B30;
      color: #fff;
      border: 0;
      border-radius: 12px;
      padding: 12px 24px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
    }
    button:active { opacity: 0.8; }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo" aria-hidden="true">
      <svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
        <path d="M292 96 L160 288 h88 l-28 128 132-192 h-88 z" fill="#FF3B30"/>
      </svg>
    </div>
    <h1>You're offline</h1>
    <p>Looks like you lost your connection. Reconnect to keep hustling — your progress is saved.</p>
    <button onclick="location.reload()">Try again</button>
  </div>
</body>
</html>
